name: Деплой на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Збірка клієнта
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      # Абсолютний URL вашого сервера Miston (Render/Railway/VPS). Без нього
      # фронтенд шукатиме API на github.io і не знайде його.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck -w client
      - run: npm run build -w client

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    name: Публікація
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
