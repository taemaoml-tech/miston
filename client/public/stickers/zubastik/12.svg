<svg viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><style>/* sticker animations */
  .root{transform-origin:100px 205px}
  .head{transform-origin:100px 150px}
  .fb{transform-box:fill-box;transform-origin:center}
  .a-bounce{animation:bounce 1.2s ease-in-out infinite}
  .a-shake{animation:shake .45s ease-in-out infinite}
  .a-wiggle{animation:wiggle 1.4s ease-in-out infinite}
  .a-float{animation:float 3s ease-in-out infinite}
  .a-jump{animation:jump 1s cubic-bezier(.3,.7,.4,1) infinite}
  .a-tremble{animation:tremble .14s linear infinite}
  .a-pulse{animation:pulse .9s ease-in-out infinite}
  .a-squash{animation:squash 1.1s ease-in-out infinite}
  .a-wobble{animation:wobble 1.8s ease-in-out infinite}
  .a-snap{animation:snap .9s ease-in-out infinite}
  .h-tilt{animation:tilt 2.4s ease-in-out infinite}

  @keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-12px) scale(.97,1.03)}60%{transform:translateY(0) scale(1.05,.95)}}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  @keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes jump{0%,100%{transform:translateY(0) scale(1.06,.94)}20%{transform:translateY(0) scale(.95,1.05)}50%{transform:translateY(-22px) scale(1,1)}80%{transform:translateY(0) scale(1.04,.96)}}
  @keyframes tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.6px)}75%{transform:translateX(1.6px)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes squash{0%,100%{transform:scale(1,1)}40%{transform:scale(1.1,.88)}70%{transform:scale(.96,1.05)}}
  @keyframes wobble{0%,100%{transform:rotate(0) translateX(0)}25%{transform:rotate(-10deg) translateX(-6px)}75%{transform:rotate(10deg) translateX(6px)}}
  @keyframes snap{0%,100%{transform:scale(1)}20%{transform:scale(1.08,.9)}30%{transform:scale(.96,1.06)}45%{transform:scale(1)}}
  @keyframes tilt{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

  .blink{animation:blink 4.2s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
  .wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave .8s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(16deg)}}
  .drip{animation:drip 1.1s ease-in infinite}
  @keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(28px);opacity:0}}
  .jl{animation:jl .8s ease-out infinite}.jr{animation:jr .8s ease-out infinite}
  @keyframes jl{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-22px,16px);opacity:0}}
  @keyframes jr{0%{transform:translate(0,0);opacity:1}100%{transform:translate(22px,16px);opacity:0}}
  .rise{animation:rise 2.4s ease-out infinite}
  @keyframes rise{0%{transform:translateY(10px) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-38px) scale(1.1);opacity:0}}
  .twinkle{animation:twinkle 1.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
  .fall{animation:fall 1.8s linear infinite}
  @keyframes fall{0%{transform:translateY(-24px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(70px) rotate(300deg);opacity:0}}
  .rain{animation:rain .8s linear infinite}
  @keyframes rain{0%{transform:translateY(-10px);opacity:0}20%{opacity:.9}100%{transform:translateY(46px);opacity:0}}
  .steam{animation:steam 1.8s ease-out infinite}
  @keyframes steam{0%{transform:translateY(4px) scaleX(1);opacity:0}30%{opacity:.85}100%{transform:translateY(-18px) scaleX(1.3);opacity:0}}
  .beat{animation:beat .8s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.95)}}
  .spin{animation:spin 2.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .glint{animation:glint 2.2s ease-in-out infinite}
  @keyframes glint{0%,60%,100%{opacity:0;transform:translateX(-6px)}75%{opacity:1;transform:translateX(6px)}}
  .chatter{animation:tremble .1s linear infinite}
  .pop{animation:pop 1s ease-in-out infinite}
  @keyframes pop{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(-3deg)}}
  .bubble{animation:bubble 2.6s ease-in-out infinite}
  @keyframes bubble{0%,100%{transform:scale(.35)}60%{transform:scale(1.05)}70%{transform:scale(1.15);opacity:1}72%{opacity:0;transform:scale(1.3)}}
  .hat{transform-box:fill-box;transform-origin:50% 100%;animation:hat 1.4s ease-in-out infinite}
  @keyframes hat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-6deg)}}
  .brush{animation:brush .32s ease-in-out infinite}
  @keyframes brush{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
  .ripple{animation:ripple 2s ease-out infinite}
  @keyframes ripple{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.35);opacity:0}}

  .tail{transform-origin:134px 194px;animation:swish 2s ease-in-out infinite}
  @keyframes swish{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(9deg)}}

  .paused *{animation-play-state:paused !important}
  @media (prefers-reduced-motion:reduce){ .grid *, .avatar *{animation:none !important} }
</style>
  <g class="root a-wiggle" style="animation-delay:-1.87s">
    <g class="tail"><path d="M134 194Q182 204 182 170Q182 148 194 136" stroke="#66752F" stroke-width="22" fill="none" stroke-linecap="round"/><path d="M134 194Q182 204 182 170Q182 148 194 136" stroke="#8E9F4B" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M134 194Q182 204 182 170Q182 148 194 136" stroke="#66752F" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="3 9"/></g>
    <ellipse cx="100" cy="180" rx="46" ry="27" fill="#8E9F4B"/>
    <ellipse cx="100" cy="184" rx="26" ry="20" fill="#EFE2B0"/>
    <path d="M80 176H120M78 186H122M82 196H118" stroke="#CDBD80" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="80" cy="201" rx="12" ry="7.5" fill="#8E9F4B" stroke="#66752F" stroke-width="2"/>
    <ellipse cx="120" cy="201" rx="12" ry="7.5" fill="#8E9F4B" stroke="#66752F" stroke-width="2"/>
    <path d="M72 203l-2 4M80 204v4M88 203l2 4M112 203l-2 4M120 204v4M128 203l2 4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    
    <g class="head ">
      <ellipse cx="100" cy="110" rx="60" ry="44" fill="#8E9F4B"/>
      <circle cx="74" cy="85" r="22" fill="#8E9F4B"/><path d="M56 72Q74 56 92 72" stroke="#66752F" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/><circle cx="126" cy="85" r="22" fill="#8E9F4B"/><path d="M108 72Q126 56 144 72" stroke="#66752F" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/>
      <circle cx="100" cy="70" r="4" fill="#66752F"/><circle cx="90" cy="74" r="3" fill="#66752F"/><circle cx="110" cy="74" r="3" fill="#66752F"/>
      <ellipse cx="100" cy="142" rx="66" ry="26" fill="#A5B563"/>
      <path d="M40 126Q36 142 44 156M160 126Q164 142 156 156" stroke="#66752F" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".45"/>
      <circle cx="50" cy="118" r="3" fill="#66752F" opacity=".5"/><circle cx="150" cy="118" r="3" fill="#66752F" opacity=".5"/><circle cx="58" cy="110" r="2.2" fill="#66752F" opacity=".5"/><circle cx="142" cy="110" r="2.2" fill="#66752F" opacity=".5"/>
      <ellipse cx="90" cy="127" rx="5" ry="3.5" fill="#66752F"/><ellipse cx="110" cy="127" rx="5" ry="3.5" fill="#66752F"/>
      <ellipse cx="90" cy="126" rx="2.2" ry="1.6" fill="#2B3014"/><ellipse cx="110" cy="126" rx="2.2" ry="1.6" fill="#2B3014"/>
      <path d="M55.5 149.7L64.5 149.7L60 157.7Z" fill="#fff" stroke="#2B3014" stroke-width="1.4" stroke-linejoin="round"/><path d="M71.5 155.0L80.5 155.0L76 163.0Z" fill="#fff" stroke="#2B3014" stroke-width="1.4" stroke-linejoin="round"/><path d="M119.5 155.0L128.5 155.0L124 163.0Z" fill="#fff" stroke="#2B3014" stroke-width="1.4" stroke-linejoin="round"/><path d="M135.5 149.7L144.5 149.7L140 157.7Z" fill="#fff" stroke="#2B3014" stroke-width="1.4" stroke-linejoin="round"/><path d="M50 146Q100 172 150 146" stroke="#2B3014" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="fb blink"><circle cx="74" cy="86" r="14" fill="#F5B83D" stroke="#2B3014" stroke-width="2.5"/><ellipse cx="74" cy="86" rx="4" ry="11" fill="#1E1719"/><circle cx="79" cy="81" r="4" fill="#fff"/><circle cx="69" cy="92" r="1.8" fill="#fff"/></g><path d="M115 90Q126 75 137 90" stroke="#2B3014" stroke-width="5" fill="none" stroke-linecap="round"/>
      
      <g class="hat"><path d="M68 66Q68 26 100 30Q132 26 132 66Z" fill="#8A5530" stroke="#4a2a14" stroke-width="2.5"/><rect x="70" y="54" width="60" height="9" fill="#3a2010"/><ellipse cx="100" cy="66" rx="64" ry="11" fill="#9C6238" stroke="#4a2a14" stroke-width="2.5"/></g>
    </g>
    
  </g></svg>