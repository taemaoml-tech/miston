<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Miston — твій сучасний месенджер. Чати, групи, канали, дзвінки та стікери в одному простому інтерфейсі." />
    <meta property="og:title" content="Miston — твій сучасний месенджер" />
    <meta property="og:description" content="Спілкування з друзями, командами та спільнотами: миттєві чати, дзвінки й демонстрація екрана." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Miston</title>
    <script>
      // Стартовий екран має збігатися зі збереженою темою ще до монтування React.
      (function () {
        try {
          var saved = localStorage.getItem('relay.theme');
          var dark = saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#000000');
          }
        } catch (error) {
          // localStorage може бути недоступний у приватному режимі.
        }
      })();
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        box-sizing: border-box;
        padding-top: clamp(1cm, calc(var(--miston-safe-top, env(safe-area-inset-top, 0px)) + 2mm), 2cm);
        padding-bottom: clamp(5mm, calc(var(--miston-safe-bottom, env(safe-area-inset-bottom, 0px)) + 1mm), 1.2cm);
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
        color: #000000;
      }
      html.dark #boot-splash { background: #000000; color: #ffffff; }
      html.dark #boot-splash .boot-slogan { color: #94a3b8; }
      html.dark #boot-splash .boot-track { background: #1e293b; }
      #boot-splash svg { animation: boot-float 2.6s ease-in-out infinite; border-radius: 22px; }
      #boot-splash .boot-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
      #boot-splash .boot-slogan { margin-top: -14px; font-size: 13px; color: #64748b; }
      #boot-splash .boot-track { width: 156px; height: 4px; border-radius: 9999px; background: #e2e8f0; overflow: hidden; }
      #boot-splash .boot-bar { display: block; width: 50%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #007aff, #4a97ff); animation: boot-sweep 1.5s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes boot-float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(-2deg); } }
      @keyframes boot-sweep { from { transform: translateX(-110%); } to { transform: translateX(230%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash svg, #boot-splash .boot-bar { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <svg width="76" height="76" viewBox="0 0 128 128" aria-hidden="true">
        <defs>
          <linearGradient id="boot-mark" x1="18" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
            <stop stop-color="#1687FF" /><stop offset="1" stop-color="#0062E8" />
          </linearGradient>
          <filter id="boot-shadow" x="-25%" y="-20%" width="160%" height="170%">
            <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#001A3A" flood-opacity=".35" />
          </filter>
        </defs>
        <rect x="9" y="8" width="110" height="110" rx="36" fill="url(#boot-mark)" filter="url(#boot-shadow)" />
        <path d="M64 31c-19.3 0-35 13.8-35 30.8 0 9.2 4.6 17.5 12 23.1l-3.3 12.4 15.7-8.1c3.3.9 6.9 1.4 10.6 1.4 19.3 0 35-13.8 35-30.8S83.3 31 64 31Z" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M50 73V52l14 14 14-14v21" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <p class="boot-title">Miston</p>
      <p class="boot-slogan">твій сучасний месенджер</p>
      <span class="boot-track"><span class="boot-bar" /></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
