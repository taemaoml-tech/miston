<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Miston — твій сучасний месенджер. Чати, групи, канали, дзвінки, стікери та Star в одному простому інтерфейсі." />
    <meta property="og:title" content="Miston — твій сучасний месенджер" />
    <meta property="og:description" content="Спілкування з друзями, командами та спільнотами: миттєві чати, дзвінки й демонстрація екрана." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Miston</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
        color: #000000;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash { background: #000000; color: #ffffff; }
      }
      #boot-splash svg { animation: boot-float 2.6s ease-in-out infinite; border-radius: 22px; }
      #boot-splash .boot-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
      #boot-splash .boot-slogan { margin-top: -14px; font-size: 13px; color: #64748b; }
      #boot-splash .boot-track { width: 156px; height: 4px; border-radius: 9999px; background: #e2e8f0; overflow: hidden; }
      #boot-splash .boot-bar { display: block; width: 50%; height: 100%; border-radius: 9999px; background: linear-gradient(90deg, #007aff, #4a97ff); animation: boot-sweep 1.5s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes boot-float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(-2deg); } }
      @keyframes boot-sweep { from { transform: translateX(-110%); } to { transform: translateX(230%); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash svg, #boot-splash .boot-bar { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <svg width="76" height="76" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="boot-mark" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#4a97ff" /><stop offset=".55" stop-color="#007aff" /><stop offset="1" stop-color="#003d7d" />
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="15" fill="url(#boot-mark)" />
        <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 39.6Q32 36.4 57 39.6" stroke-width="2.3" />
          <path d="M7 35Q14 28 21 24" stroke-width="1.8" />
          <path d="M57 35Q50 28 43 24" stroke-width="1.8" />
          <path d="M21 24C24 15.5 40 15.5 43 24" stroke-width="1.8" />
          <path d="M21 24C24 32.5 40 32.5 43 24" stroke-width="1.8" />
          <path d="M21 24V49M25 24V49M39 24V49M43 24V49" stroke-width="1.9" />
          <path d="M20 24H26M38 24H44M19.5 49H26.5M37.5 49H44.5" stroke-width="1.9" />
          <path d="M21 27.5L25 32M25 27.5L21 32M21 33.5L25 38M25 33.5L21 38M39 27.5L43 32M43 27.5L39 32M39 33.5L43 38M43 33.5L39 38" stroke-width="1.4" />
          <path d="M27 29.4V38.2M32 31.1V37.6M37 29.4V38.2" stroke-width="1.1" opacity=".9" />
        </g>
      </svg>
      <p class="boot-title">Miston</p>
      <p class="boot-slogan">твій сучасний месенджер</p>
      <span class="boot-track"><span class="boot-bar" /></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
